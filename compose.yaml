version: '3.8'

services:
  episode-matcher:
    build: .
    container_name: episode-matcher
    restart: unless-stopped
    ports:
      - "8000:8000" # Web UI at http://<your-ip>:8000
    environment:
      # ---------------------------------------------------------------
      # REQUIRED: OpenSubtitles API key
      # Register for free at https://www.opensubtitles.com/en/consumers
      # Used for hash-based episode lookup (primary) and subtitle
      # downloads for transcript matching (fallback).
      # Free tier: 5 req/sec, 40 subtitle downloads/day (cached locally).
      # ---------------------------------------------------------------
      - OPENSUBTITLES_API_KEY=

      # ---------------------------------------------------------------
      # OPTIONAL: metadata source
      # Leave TMDB_API_KEY blank to use the free TVmaze API instead.
      # ---------------------------------------------------------------
      - TMDB_API_KEY=

      # ---------------------------------------------------------------
      # OPTIONAL: Whisper settings (only used when hash lookup fails)
      # Model sizes: tiny | base | small | medium | large-v3
      # Device: cuda or cpu
      # ---------------------------------------------------------------
      - WHISPER_MODEL_SIZE=base
      - WHISPER_DEVICE=cuda

    volumes:
      # Map your media share into the container (read-write so we can rename files).
      # In the UI, type /data/TV Shows/The Office/Season 1
      - /mnt/user/media:/data:rw

      # Persist the Whisper model and subtitle cache between container restarts.
      - ./whisper_cache:/root/.cache/huggingface
      - ./subtitle_cache:/app/subtitle_cache

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
